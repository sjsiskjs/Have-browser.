name: Build and Package Browser (Windows)
on:
  workflow_dispatch:

jobs:
  build:
    name: Build on windows-latest
    runs-on: windows-latest
    steps:
      # 0. Libera spazio extra sul runner
      - name: Free disk space
        shell: powershell
        working-directory: C:\
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\ghcup" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Used,Free

      # 1. Scarica il codice del fork in un percorso corto, per evitare il limite MAX_PATH
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: C:\build-dir

      # 2. Configura Python per l'ambiente Mozilla
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Scarica i veri MozillaBuild Tools per Windows dall'FTP ufficiale
      - name: Install MozillaBuild
        shell: powershell
        working-directory: C:\build-dir
        run: |
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla.org/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe" -OutFile "MozillaBuildSetup.exe"
          Start-Process -FilePath ".\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait

      # 4. Sistema il conflitto pyyaml prima del bootstrap
      - name: Fix Python Dependencies
        shell: bash
        working-directory: C:\build-dir
        run: |
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall "pyyaml>=6.0,<7.0"

      # 5. Bootstrap: installa Visual Studio Build Tools, Rust e le altre dipendenze
      #    NIENTE --no-system-changes: su un runner usa-e-getta va bene che installi tutto.
      - name: Mach Bootstrap
        shell: bash
        working-directory: C:\build-dir
        run: |
          C:/mozilla-build/msys/bin/bash.exe --login -c "cd /c/build-dir && (echo yes | ./mach bootstrap --application-choice=browser || true)"

      # 6. Configura le opzioni di compilazione
      - name: Configure Build (mozconfig)
        shell: bash
        working-directory: C:\build-dir
        run: |
          echo "ac_add_options --enable-release" > mozconfig
          echo "ac_add_options --disable-tests" >> mozconfig
          echo "ac_add_options --enable-project=browser" >> mozconfig

      # 7. Compila il browser
      - name: Compile Browser
        shell: bash
        working-directory: C:\build-dir
        run: |
          C:/mozilla-build/msys/bin/bash.exe --login -c "cd /c/build-dir && ./mach build"

      # 8. Impacchetta i file e genera l'installer nativo
      - name: Create Installer Package
        shell: bash
        working-directory: C:\build-dir
        run: |
          C:/mozilla-build/msys/bin/bash.exe --login -c "cd /c/build-dir && ./mach package && ./mach build installer"

      # 9. Localizza l'installer generato e copialo in un percorso fisso
      - name: Locate Installer
        shell: powershell
        run: |
          $InstallerFile = Get-ChildItem -Path "C:\build-dir\" -Filter "*.installer.exe" -Recurse | Select-Object -First 1
          if ($InstallerFile) {
            Write-Host "Installer trovato in: $($InstallerFile.FullName)"
            New-Item -ItemType Directory -Path "C:\dist-out" -Force
            Copy-Item -Path $InstallerFile.FullName -Destination "C:\dist-out\browser-setup.exe"
          } else {
            throw "ERRORE: Nessun file .installer.exe generato da mach package!"
          }

      # 10. Salva l'installer come artifact
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Have-Browser-installer-windows
          path: C:/dist-out/browser-setup.exe
          if-no-files-found: error
