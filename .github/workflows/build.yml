name: Build and Package Browser

on:
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    steps:
      # 0. Libera spazio (Windows)
      - name: Free disk space (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk" -ErrorAction SilentlyContinue
          Get-PSDrive C | Select-Object Used,Free

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ${{ matrix.os == 'windows-latest' && 'C:\build-dir' || 'browser-source' }}
          submodules: recursive

      # 2. Python (Solo Linux/Mac)
      - name: Set up Python (Linux/Mac)
        if: matrix.os != 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install MozillaBuild (Windows)
      - name: Install MozillaBuild (Windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        working-directory: C:\build-dir
        run: |
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe" -OutFile "MozillaBuildSetup.exe"
          Start-Process -FilePath ".\MozillaBuildSetup.exe" -ArgumentList "/S" -Wait

      # 4. Fix PyYAML (SOLO Linux/Mac - Windows usa il suo Python isolato)
      - name: Fix Python Dependencies (Linux/Mac)
        if: matrix.os != 'windows-latest'
        shell: bash
        working-directory: browser-source
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install --force-reinstall pyyaml==6.0.3

      # 5. Mach Bootstrap
      - name: Mach Bootstrap
        shell: bash
        working-directory: ${{ matrix.os == 'windows-latest' && 'C:\build-dir' || 'browser-source' }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            (yes || true) | /c/mozilla-build/start-shell.bat "./mach bootstrap --application-choice=browser --no-system-changes"
          else
            yes 2>/dev/null | ./mach bootstrap --application-choice=browser --no-system-changes || true
          fi

      # 5b. Install System Clang (Linux)
      - name: Install System Clang (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      # 5c. Install System Clang (macOS)
      - name: Install System Clang (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          brew install llvm lld
          echo "LLVM_PATH=$(brew --prefix llvm)" >> $GITHUB_ENV

      # 6. Configure Build (mozconfig)
      - name: Configure Build (mozconfig)
        shell: bash
        working-directory: ${{ matrix.os == 'windows-latest' && 'C:\build-dir' || 'browser-source' }}
        run: |
          cat > mozconfig << EOF
          ac_add_options --enable-release
          ac_add_options --disable-tests
          ac_add_options --enable-project=browser
          ac_add_options --disable-bootstrap
          EOF

          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "ac_add_options --with-clang-path=$(which clang)" >> mozconfig
            echo "ac_add_options --with-ld-path=$(which lld)" >> mozconfig
            echo "export CC=$(which clang)" >> mozconfig
            echo "export CXX=$(which clang++)" >> mozconfig
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            echo "ac_add_options --with-clang-path=${{ env.LLVM_PATH }}/bin/clang" >> mozconfig
            echo "ac_add_options --with-ld-path=${{ env.LLVM_PATH }}/bin/lld" >> mozconfig
            echo "export CC=${{ env.LLVM_PATH }}/bin/clang" >> mozconfig
            echo "export CXX=${{ env.LLVM_PATH }}/bin/clang++" >> mozconfig
          fi
          # Su Windows, MozillaBuild gestisce già il clang corretto internamente

      # 7. Compile Browser (Rimosso 'exec' pericoloso su Windows)
      - name: Compile Browser
        shell: bash
        working-directory: ${{ matrix.os == 'windows-latest' && 'C:\build-dir' || 'browser-source' }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            /c/mozilla-build/start-shell.bat "./mach build"
          else
            ./mach build
          fi

      # 8. Package (Rimosso 'exec' pericoloso su Windows)
      - name: Create Installer Package
        shell: bash
        working-directory: ${{ matrix.os == 'windows-latest' && 'C:\build-dir' || 'browser-source' }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            /c/mozilla-build/start-shell.bat "./mach package"
          else
            ./mach package
          fi

      # 9. Upload Installer
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Have-Browser-installer-${{ matrix.os }}
          path: |
            **/obj-*/dist/*.installer.exe
            **/obj-*/dist/*.exe
            **/obj-*/dist/*.dmg
            **/obj-*/dist/*.tar.bz2
            **/obj-*/dist/*.deb
          if-no-files-found: error
          retention-days: 5   
